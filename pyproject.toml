[project]
name = "john-agent"
version = "1.0.0"
description = "User-initiated, read-only MCP document tools over a pdftomd/mdtodb corpus"
requires-python = ">=3.11,<3.14"
dependencies = [
    "chromadb==1.5.9",
    "google-auth-oauthlib==1.4.1",
    "httpx==0.28.1",
    "mcp>=1.26,<2",
    "mdtodb[gemini] @ git+https://github.com/SylvainRoy/mdtodb.git@aa53c3e46845faee8df3bebb6446987188e55b9b",
    "pypdf==6.19.0",
]

[project.scripts]
john-mcp = "john_agent.server:main"
john-gmail-auth = "john_agent.gmail_auth:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/john_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
]
